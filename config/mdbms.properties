# Konfigurasi mDBMS MonggoDB.
# File ini HANYA dibaca oleh modul app saat startup. Nilainya diteruskan ke
# komponen sebagai parameter (misalnya CCM.initialize(protocol, lastTxId),
# SM.startup(dataDir, bufferSize)). Komponen dan driver tidak membaca file ini.

# --- Server (QP) ---
server.host=localhost
server.port=3140

# --- Storage Manager ---
# Lokasi file runtime (.tbl, .idx, catalog.json, log FRM), relatif terhadap root repo.
storage.dataDir=data
# Ukuran blok dalam byte.
storage.blockSize=4096
# Jumlah frame di buffer pool.
storage.bufferPoolSize=64
# Muat database contoh dari sm/src/main/resources/sample/ jika data kosong.
storage.loadSampleOnEmpty=true

# --- Concurrency Control Manager ---
# Protokol aktif: LOCK atau TIMESTAMP. Default: LOCK.
ccm.protocol=LOCK
# Batas waktu deteksi deadlock dalam milidetik.
ccm.deadlockTimeoutMs=5000

# --- Failure Recovery Manager ---
# Interval checkpoint berkala dalam detik. 0 berarti checkpoint berkala dimatikan.
frm.checkpointIntervalSec=300
